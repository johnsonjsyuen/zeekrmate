services:
  fordlogger:
    build: .
    volumes:
      # config.json must exist on the host first (no directory is created).
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
      # Only data mount: Zeekr session (zeekr_session.json) and captures.
      - ./data:/app/data
    environment:
      - FORDLOGGER_STORE_RAW_JSON=${FORDLOGGER_STORE_RAW_JSON:-true}
      - FORDLOGGER_GEOCODING=${FORDLOGGER_GEOCODING:-true}
      - FORDLOGGER_STATE_DIR=/app/data
      - ZEEKR_CAPTURE_DIR=/app/data/captures
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fordlogger
      POSTGRES_USER: fordlogger
      POSTGRES_PASSWORD: fordlogger
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fordlogger"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - db
    environment:
      GF_INSTALL_PLUGINS: pr0ps-trackmap-panel
      GF_SECURITY_ADMIN_PASSWORD: fordlogger
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
